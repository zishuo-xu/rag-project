[project]
name = "rag-project"
version = "0.1.0"
description = "A production-grade RAG system with multi-recall, reranking, hierarchical indexing, and RAGAS evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LangChain core
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    # Vector store & retrieval
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    # API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    # Frontend
    "streamlit>=1.38.0",
    "requests>=2.32.0",
    # Evaluation
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    # Document loading
    "pypdf>=5.0.0",
    # Config & utils
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.5.0",
    "langchain-chroma>=1.1.0",
    "networkx>=3.6.1",
    "langchain-experimental>=0.4.2",
    "pyvis>=0.3.2",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
